# Blueprint do Render — provisiona a API a partir do repositório.
#
# Uso: no painel do Render, New > Blueprint, apontando para este repositório.
# O banco NÃO é mais do Render: fica no Neon (projeto quiet-bar-22053390,
# branch production), declarado em neon.ts na raiz. Ver docs/deploy.md.

services:
  - type: web
    name: studio-keer-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # O Render usa isto para saber quando o deploy ficou pronto. O endpoint
    # responde 200 mesmo com o banco fora, informando o estado no corpo — se
    # devolvesse 503, o Render reiniciaria a API em loop durante uma queda do
    # Postgres, o que não conserta nada.
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        # PREENCHER com a conexão POOLED do Neon (host com `-pooler`), que é a
        # DATABASE_URL do `.env.local` gerado por `neon deploy`.
        sync: false
      - key: DATABASE_URL_UNPOOLED
        # PREENCHER com a conexão DIRETA do Neon (sem `-pooler`). É a que o
        # start.sh usa para as migrations: PgBouncer em modo transação não
        # guarda estado de sessão.
        sync: false
      - key: SECRET_KEY
        # Gerado pelo Render e nunca visto por ninguém. Não versionar segredo.
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: CORS_ORIGINS
        # PREENCHER com a URL da Vercel depois do primeiro deploy do frontend.
        # Sem isto o navegador bloqueia toda chamada e a tela fica vazia sem
        # erro visível na API.
        sync: false
